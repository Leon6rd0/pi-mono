name: Publish Linux x64 Trial

on:
  push:
    tags:
      - 'trial-linux-x64-*'

permissions: {}

concurrency:
  group: linux-x64-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'Leon6rd0/pi-mono' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-trial-agent
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Hydrate the immutable model catalog without changing generated source
        run: |
          set -euo pipefail
          revision="$(jq -r .revision nix/model-catalog.json)"
          [[ "$revision" =~ ^sha256-[0-9a-f]{64}$ ]]
          catalog="$RUNNER_TEMP/models.all.json"
          curl --fail --silent --show-error --location --retry 3 \
            "https://pi.dev/api/models/revisions/${revision}?types=chat,image,classifier" \
            --output "$catalog"
          printf '%s  %s\n' "${revision#sha256-}" "$catalog" | sha256sum --check
          node packages/ai/scripts/hydrate-model-catalog.ts "$catalog"

      - name: Check source
        run: npm run check

      - name: Run offline coding-agent regressions
        working-directory: packages/coding-agent
        run: |
          node ../../node_modules/vitest/dist/cli.js --run \
            test/branch-summarization.test.ts \
            test/compaction.test.ts \
            test/compaction-serialization.test.ts \
            test/compaction-continuity.test.ts \
            test/interrupted-context.test.ts \
            test/compaction-nested-calls.test.ts \
            test/compaction-summary-reasoning.test.ts \
            test/compaction-extensions-example.test.ts \
            test/suite/agent-session-compaction.test.ts \
            test/suite/compaction-continuity.test.ts \
            test/suite/interrupted-context.test.ts

      - name: Run offline AI regressions
        working-directory: packages/ai
        run: |
          node ../../node_modules/vitest/dist/cli.js --run \
            test/context-estimate.test.ts \
            test/openai-responses-interrupted-cache.test.ts \
            test/openai-responses-partial-json-cleanup.test.ts

      - name: Build only Linux x64
        run: |
          bash scripts/build-binaries.sh --skip-install --offline-model-data \
            --platform linux-x64 --out "$RUNNER_TEMP/binaries"
          git diff --exit-code

      - name: Smoke-test the standalone binary outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/binaries/linux-x64/pi" --help
          "$RUNNER_TEMP/binaries/linux-x64/pi" --version
          "$RUNNER_TEMP/binaries/linux-x64/pi" --list-models > "$RUNNER_TEMP/trial-models.txt"
          test -s "$RUNNER_TEMP/trial-models.txt"
          node "$GITHUB_WORKSPACE/scripts/smoke-test-codemode-binary.mjs" "$RUNNER_TEMP/binaries/linux-x64/pi"

      - name: Package the verified binary and portable trial documentation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          package="$RUNNER_TEMP/trial-package/pi"
          mkdir -p "$assets" "$package"
          cp -a "$RUNNER_TEMP/binaries/linux-x64/." "$package/"
          cp LICENSE "$package/"
          binary_sha="$(sha256sum "$package/pi" | cut -d ' ' -f 1)"
          jq --null-input \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg version "$("$package/pi" --version)" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg catalog "$(jq -r .revision nix/model-catalog.json)" \
            --arg binary_sha "$binary_sha" \
            --arg bun "$(bun --version)" \
            --arg node "$(node --version)" \
            '{releaseTag: $tag, sourceCommit: $commit, upstreamVersion: $version,
              builtAt: $built_at, modelCatalogRevision: $catalog, binarySha256: $binary_sha,
              platform: "linux-x64", target: "bun-linux-x64-baseline", libc: "glibc",
              bundledRuntime: true, compiler: {bun: $bun, node: $node},
              sourceCheck: true, offlineRegressions: true, cliSmoke: true,
              codemodeMockSmoke: true, realServerCacheHitTested: false}' \
            > "$assets/BUILD-INFO.json"
          cat > "$assets/TRIAL-README.md" <<'EOF'
          # Pi Linux x64 试用版

          这是 Leon6rd0/pi-mono 的独立预发布构建，基于 Pi v1.1.0，包含 compact 任务续接及中断上下文清理。

          ## 使用

          下载 pi-linux-x64.tar.gz、SHA256SUMS、BUILD-INFO.json 和本文件后：

          ```bash
          sha256sum --check SHA256SUMS
          tar -xzf pi-linux-x64.tar.gz
          ./pi/pi --version
          ./pi/pi --session '/完整路径/原会话.jsonl'
          ```

          适用于 Linux x86_64/glibc，不是 Alpine/musl 包。运行时内嵌，无需安装 Node 或 Bun。
          保留整个 pi/ 目录。默认沿用 ~/.pi/agent 的配置、登录及会话，不覆盖现有程序。
          --version 仍显示 1.1.0；用发布标签、BUILD-INFO.json 和 SHA256SUMS 区分 fork 构建。
          不要运行 pi update self，否则可能替换为上游程序。

          ## 行为与验证边界

          - 中断和错误回答保留在原始历史，但不进入后续有效模型上下文。
          - 默认 compact 和分支摘要不吸收其正文、思考或未执行工具调用。
          - 有效上下文估算、保留边界及文件操作元数据忽略这些碎片；已执行工具不会回滚。
          - 仅打断响应不自动等于取消原任务，后续真实用户消息决定目标和权限。
          - 旧摘要里的碎片不自动修复；历史计费不变。
          - 发布前运行离线回归、完整源码检查和独立二进制 CLI/codemode 模拟测试。
          - 不主动清空前缀缓存，但不保证真实服务端命中；未测取消后的服务端缓存写入。
          EOF
          cp "$assets/BUILD-INFO.json" "$assets/TRIAL-README.md" "$package/"
          tar -czf "$assets/pi-linux-x64.tar.gz" -C "$RUNNER_TEMP/trial-package" pi
          cd "$assets"
          sha256sum pi-linux-x64.tar.gz BUILD-INFO.json TRIAL-README.md > SHA256SUMS
          sha256sum --check SHA256SUMS
          cp TRIAL-README.md RELEASE_NOTES.md
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> RELEASE_NOTES.md

      - name: Stage release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-trial-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.repository == 'Leon6rd0/pi-mono' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-x64-trial-${{ github.ref_name }}
          path: release-assets

      - name: Create and verify the draft, then publish the prerelease
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          existing="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
            --title 'Pi Linux x64: compaction continuity and interrupted-context cleanup' \
            --notes-file RELEASE_NOTES.md \
            pi-linux-x64.tar.gz SHA256SUMS BUILD-INFO.json TRIAL-README.md
          expected="$(printf '%s\n' pi-linux-x64.tar.gz SHA256SUMS BUILD-INFO.json TRIAL-README.md | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected" ]]
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/upload-verification"
          (cd "$RUNNER_TEMP/upload-verification" && sha256sum --check SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease
